apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-planner-be
  namespace: app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nutrition-planner-be
  template:
    metadata:
      labels:
        app: nutrition-planner-be
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/actuator/prometheus"
    spec:
      containers:
        - name: nutrition-planner-be
          image: acrfsakiiashchenkoi.azurecr.io/nutrition-planner-backend:latest
          imagePullPolicy: Always
          env:
            - name: SPRING_PROFILES_ACTIVE
              value: "kubernetes"
            - name: DB_URL
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db_url
            - name: DB_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db_username
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db_password
            - name: APP_BASE_URL
              value: https://nutrition-planner.20-166-89-50.nip.io
            - name: ISSUER_URI
              value: $(APP_BASE_URL)/auth/realms/NUTRITION
            - name: JWT_SET_URI
              value: $(APP_BASE_URL)/auth/realms/NUTRITION/protocol/openid-connect/certs
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://$(DB_URL):5432/nutrition-planner-db
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db_username
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-secret
                  key: db_password
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI
              value: $(ISSUER_URI)
            - name: SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_JWK_SET_URI
              value: $(JWT_SET_URI)
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: openai-secret
                  key: api_key
          resources:
            limits:
              cpu: 750m
              memory: 768Mi
            requests:
              cpu: 200m
              memory: 384Mi
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 5
            httpGet:
              path: /actuator/health/liveness
              port: http
          readinessProbe:
            initialDelaySeconds: 60
            periodSeconds: 10
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 3
            httpGet:
              path: /actuator/health/readiness
              port: http
