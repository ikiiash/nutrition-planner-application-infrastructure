apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gitlab-deploy
  namespace: app
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    resourceNames:
      - nutrition-planner-be
      - nutrition-planner-fe
    verbs: ["get", "patch", "update"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/status", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["list", "watch"]

---

apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: gitlab-deploy-infra-default
  namespace: app
subjects:
  - kind: ServiceAccount
    name: default
    namespace: infra
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: gitlab-deploy
