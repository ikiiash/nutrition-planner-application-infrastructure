apiVersion: v1
kind: ConfigMap
metadata:
  name: nutrition-planner-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  nutrition-planner.json: |
    {
      "title": "Nutrition Planner",
      "uid": "nutrition-planner",
      "schemaVersion": 38,
      "version": 1,
      "refresh": "30s",
      "time": { "from": "now-1h", "to": "now" },
      "tags": ["nutrition-planner", "spring-boot"],
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(http_server_requests_seconds_count{namespace=\"app\", pod=~\"nutrition-planner-be.*\"}[2m])) by (uri, status)",
              "legendFormat": "{{status}} {{uri}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "mode": "palette-classic" } }
          }
        },
        {
          "id": 2,
          "title": "HTTP Error Rate (4xx/5xx)",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(http_errors_total{namespace=\"app\"}[2m])) by (status)",
              "legendFormat": "{{status}} errors"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps", "color": { "mode": "fixed", "fixedColor": "red" } }
          }
        },
        {
          "id": 3,
          "title": "P99 / P95 Response Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "histogram_quantile(0.99, sum(rate(http_server_requests_seconds_bucket{namespace=\"app\", pod=~\"nutrition-planner-be.*\"}[2m])) by (le))",
              "legendFormat": "p99"
            },
            {
              "datasource": { "type": "prometheus" },
              "expr": "histogram_quantile(0.95, sum(rate(http_server_requests_seconds_bucket{namespace=\"app\", pod=~\"nutrition-planner-be.*\"}[2m])) by (le))",
              "legendFormat": "p95"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 4,
          "title": "JVM Heap Memory",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 8 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "jvm_memory_used_bytes{namespace=\"app\", pod=~\"nutrition-planner-be.*\", area=\"heap\"}",
              "legendFormat": "Used"
            },
            {
              "datasource": { "type": "prometheus" },
              "expr": "jvm_memory_max_bytes{namespace=\"app\", pod=~\"nutrition-planner-be.*\", area=\"heap\"}",
              "legendFormat": "Max"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "bytes" }
          }
        },
        {
          "id": 5,
          "title": "DB Connection Pool",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 16 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "hikaricp_connections_active{namespace=\"app\", pod=~\"nutrition-planner-be.*\"}",
              "legendFormat": "Active"
            },
            {
              "datasource": { "type": "prometheus" },
              "expr": "hikaricp_connections_pending{namespace=\"app\", pod=~\"nutrition-planner-be.*\"}",
              "legendFormat": "Pending"
            },
            {
              "datasource": { "type": "prometheus" },
              "expr": "hikaricp_connections_max{namespace=\"app\", pod=~\"nutrition-planner-be.*\"}",
              "legendFormat": "Max"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "short" }
          }
        },
        {
          "id": 6,
          "title": "GC Pause Time",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 16 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(jvm_gc_pause_seconds_sum{namespace=\"app\", pod=~\"nutrition-planner-be.*\"}[2m])) by (action, cause)",
              "legendFormat": "{{action}} / {{cause}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "s" }
          }
        },
        {
          "id": 7,
          "title": "Nginx Frontend — Requests/s",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 0, "y": 24 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(nginx_http_requests_total{namespace=\"app\", pod=~\"nutrition-planner-fe.*\"}[2m]))",
              "legendFormat": "req/s"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "reqps" }
          }
        },
        {
          "id": 8,
          "title": "Pod CPU Usage",
          "type": "timeseries",
          "gridPos": { "h": 8, "w": 12, "x": 12, "y": 24 },
          "targets": [
            {
              "datasource": { "type": "prometheus" },
              "expr": "sum(rate(container_cpu_usage_seconds_total{namespace=\"app\", container=~\"nutrition-planner.*\"}[2m])) by (container)",
              "legendFormat": "{{container}}"
            }
          ],
          "fieldConfig": {
            "defaults": { "unit": "cores" }
          }
        }
      ]
    }
