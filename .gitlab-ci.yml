stages:
  - validate

validate:terraform:
  stage: validate
  tags:
    - fsa-kiiashchenko
  image: hashicorp/terraform:1.11.4
  script:
    - |
      set -e
      for dir in terraform/*; do
        if [ -d "$dir" ]; then
          echo "Validating $dir"
          terraform -chdir="$dir" init -backend=false -input=false
          terraform -chdir="$dir" validate
        fi
      done

validate:kubernetes:
  stage: validate
  tags:
    - fsa-kiiashchenko
  image: alpine:3.22
  script:
    - apk add --no-cache yamllint
    - |
      RULES="{extends: default, rules: {line-length: disable, trailing-spaces: disable, document-start: disable, new-lines: disable, comments: disable, comments-indentation: disable, indentation: disable, braces: disable}}"
      yamllint -d "$RULES" kubernetes/workload
      yamllint -d "$RULES" kubernetes/helm/helm-values
